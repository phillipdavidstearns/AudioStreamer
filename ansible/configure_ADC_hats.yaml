---
- hosts: mics
  become: yes
  gather_facts: false
  tasks:

  - name: Add dtoverlay for DAC+ ADC
    ansible.builtin.lineinfile:
      path: /boot/firmware/config.txt
      state: present
      insertafter: '[all]'
      line: 'dtoverlay=hifiberry-dacplusadc'

  - name: Disable headphone HDMI audio
    ansible.builtin.replace:
      dest: /boot/firmware/config.txt
      regexp: '^dtparam=audio=on'
      replace: '#dtparam=audio=on'

  - name: Disable headphone jack audio
    ansible.builtin.replace:
      dest: /boot/firmware/config.txt
      regexp: 'dtoverlay=vc4-kms-v3d'
      replace: 'dtoverlay=vc4-kms-v3d,noaudio'
