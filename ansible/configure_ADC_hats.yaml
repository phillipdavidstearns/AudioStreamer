---
- hosts: mics
  become: yes
  gather_facts: false
  tasks:

  - name: Add dtoverlay for DAC+ ADC
    ansible.builtin.lineinfile:
      path: /boot/firmware/config.txt
      state: present
      insertafter: '[all]'
      line: 'dtoverlay=hifiberry-dacplusadc'

  - name: Disable HDMI audio
    ansible.builtin.lineinfile:
      path: /boot/firmware/config.txt
      state: present
      regexp: '^dtoverlay=vc4-kms-v3d*'
      line: 'dtoverlay=vc4-kms-v3d,noaudio'

  - name: Disable headphone jack audio
    ansible.builtin.lineinfile:
      path: /boot/firmware/config.txt
      state: present
      regexp: '^dtparam=audio=on*'
      line: '#dtparam=audio=on'
