---
- name: Set up WiFi connections
  hosts: all
  become: true
  
  tasks:
  - name: Set WiFi Locale
    ansible.builtin.command:
      cmd: 'sudo raspi-config nonint do_wifi_country US'

  - name: Unblock WiFi
    ansible.builtin.command:
      cmd: 'sudo rfkill unblock wifi'

  - name: Add nmcli configuration for RedLine
    community.general.nmcli:
      type: wifi
      conn_name: "RedLineMain"
      ifname: wlan0
      ssid: RedLineMain
      wifi_sec:
        key-mgmt: wpa-psk
        psk: {{ redline_wifi_psk }}
      autoconnect: true
      autoconnect_priority: 100
      autoconnect_retries: 10
      conn_reload: true
      state: present

  - name: Add nmcli configuration for Clyfford Still
    community.general.nmcli:
      type: wifi
      conn_name: "Clyfford"
      ifname: wlan0
      ssid: Clyfford
      wifi_sec:
        key-mgmt: wpa-psk
        psk: {{ clyfford_wifi_psk }}
      autoconnect: true
      autoconnect_priority: 100
      autoconnect_retries: 10
      conn_reload: true
      state: present

  - name: Add nmcli configuration for Blowing Raspberries
    community.general.nmcli:
      type: wifi
      conn_name: "Blowing Raspberries"
      ifname: wlan0
      ssid: Blowing Raspberries
      wifi_sec:
        key-mgmt: wpa-psk
        psk: "oil & H2O don't mix"
      autoconnect: true
      autoconnect_priority: 0
      autoconnect_retries: 10
      conn_reload: true
      state: absent

  - name: Reload and enable connection
    community.general.nmcli:
      conn_name: "RedLineMain"
      conn_reload: true
      state: up